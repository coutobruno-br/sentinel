# Sentinel Engine - Docker Compose
# For local development and testing

version: '3.8'

services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-engine
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/sentinel.db
      # GitHub App (required)
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      # Paddle (required for payments)
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_CLIENT_TOKEN=${PADDLE_CLIENT_TOKEN}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET}
      - PADDLE_ENVIRONMENT=${PADDLE_ENVIRONMENT:-sandbox}
      - PADDLE_PRICE_ID_PRO=${PADDLE_PRICE_ID_PRO}
      - PADDLE_PRICE_ID_ENTERPRISE=${PADDLE_PRICE_ID_ENTERPRISE}
      # API Security
      - SENTINEL_API_KEYS=${SENTINEL_API_KEYS}
    volumes:
      - sentinel-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy for SSL
  nginx:
    image: nginx:alpine
    container_name: sentinel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - sentinel
    restart: unless-stopped
    profiles:
      - with-nginx

volumes:
  sentinel-data:
    name: sentinel-engine-data
